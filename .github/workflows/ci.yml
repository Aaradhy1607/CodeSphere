name: CodeSphere Release Gate CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-release-gate:
    name: Backend Test Suite & Security Release Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codesphere_test
          POSTGRES_PASSWORD: test_secure_password_2026
          POSTGRES_DB: codesphere_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ default-jdk

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-pull Sandboxed Runner Docker Images
        run: |
          docker pull python:3.11-slim
          docker pull gcc:13
          docker pull openjdk:17-slim
          docker pull node:20-slim

      - name: Run Backend Pytest Suite & Coverage
        working-directory: ./backend
        env:
          ENVIRONMENT: development
          SECRET_KEY: test-ci-jwt-secret-key-at-least-32-chars-long-2026
          DATABASE_URL: sqlite:///./test_ci.db
          POSTGRES_TEST_DATABASE_URL: postgresql://codesphere_test:test_secure_password_2026@localhost:5432/codesphere_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-release-gate:
    name: Frontend TypeScript & Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
